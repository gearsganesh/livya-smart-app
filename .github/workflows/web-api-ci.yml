name: LIVYA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace apps/client run typecheck
      - run: npm --workspace apps/admin run typecheck
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements.txt -r services/api/requirements-dev.txt
      - run: PYTHONPATH=services/api pytest -q services/api/tests
